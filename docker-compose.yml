services:
  anime-server:
    build: .
    image: anime-server:dev
    container_name: anime-server
    # 为 HTTP 请求结束和媒体子进程回收保留时间.
    stop_grace_period: 40s
    ports:
      - "${PORT}:8080"
    # 只向容器传递识别认证参数, 两项留空时保留本地功能.
    environment:
      DANDAN_APP_ID: "${DANDAN_APP_ID:-}"
      DANDAN_APP_SECRET: "${DANDAN_APP_SECRET:-}"
    volumes:
      - "${CONFIG_DIR}:/config"
      - "${MEDIA_DIR}:/media:ro"
      - "${DATA_DIR}:/data"
      - "${CACHE_DIR:?Set CACHE_DIR to an absolute cache directory}:/cache"
    restart: unless-stopped
