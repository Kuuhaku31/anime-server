services:
  anime-server:
    build: .
    image: anime-server:dev
    container_name: anime-server
    # 为 HTTP 请求结束和媒体子进程回收保留时间.
    stop_grace_period: 40s
    ports:
      - "${PORT}:8080"
    volumes:
      - "${CONFIG_DIR}:/config:ro"
      - "${MEDIA_DIR}:/media:ro"
      - "${DATA_DIR}:/data"
      - "${CACHE_DIR:?Set CACHE_DIR to an absolute cache directory}:/cache"
    restart: unless-stopped
