<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime Server</title>
</head>

<body>
  <header>
    <div class="brand">
      <span class="brand-mark">A</span>
      <div>
        <h1>Anime Server</h1>
        <p>Local video library</p>
      </div>
    </div>
    <button id="scan" class="primary-button">Scan videos</button>
  </header>
  <main>
    <section class="panel player-panel" tabindex="0" aria-label="Video player">
      <div class="section-heading">
        <div>
          <span class="eyebrow">Now playing</span>
          <h2>Video player</h2>
        </div>
      </div>
      <div class="video-frame">
        <div class="video-stage">
          <video id="player" playsinline preload="metadata" disablepictureinpicture disableremoteplayback></video>
        </div>
      </div>
      <div class="player-controls">
        <label class="seek-label" for="seek">Playback position</label>
        <input id="seek" type="range" min="0" max="0" value="0" step="0.1" disabled aria-label="Playback position" />
        <div class="control-buttons">
          <button id="toggle-play" type="button" disabled>Play</button>
          <button id="stop" type="button">Stop</button>
          <button id="restart" type="button">Start over</button>
          <output id="clock">0:00 / 0:00</output>
          <button id="mute" type="button">Mute</button>
          <input id="volume" type="range" min="0" max="1" value="1" step="0.05" aria-label="Volume" />
          <button id="fullscreen" type="button">Fullscreen</button>
        </div>
      </div>
      <div class="track-controls">
        <label>
          <span>Audio</span>
          <select id="audio-track" disabled></select>
        </label>
        <label>
          <span>Subtitles</span>
          <select id="subtitle-track" disabled></select>
        </label>
      </div>
      <div class="playback-feedback">
        <span id="playback-status" role="status">Select a video from the library</span>
        <!-- 缓存生成进度独立于播放位置和浏览器下载缓冲. -->
        <div id="cache-generation" hidden>
          <label for="cache-progress">Cache generation</label>
          <output id="cache-status" for="cache-progress"></output>
          <progress id="cache-progress" max="100" value="0"></progress>
        </div>
        <div id="error" role="alert"></div>
        <div id="error-actions" hidden>
          <button id="retry" type="button">Retry</button>
          <button id="retry-probe" type="button">Retry probe</button>
        </div>
      </div>
      <div id="meta">Select a video from the library</div>
    </section>
    <section class="panel files-panel">
      <div class="section-heading files-heading">
        <div>
          <span class="eyebrow">Library</span>
          <h2>Video files</h2>
        </div>
        <span id="files-count" class="count-badge">0</span>
      </div>
      <!-- 排序仅作用于浏览器列表, 不改变服务端文件地址或播放配置. -->
      <label class="library-sort">
        <span>Sort by</span>
        <select id="files-sort">
          <option value="path">Path</option>
          <option value="name-asc">Name A-Z</option>
          <option value="name-desc">Name Z-A</option>
          <option value="size-desc">Size largest first</option>
          <option value="size-asc">Size smallest first</option>
          <option value="recent">Recently watched</option>
        </select>
      </label>
      <div id="files" class="files-list"></div>
    </section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
